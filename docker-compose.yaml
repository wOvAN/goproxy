services:
  goproxy:
    image: ghcr.io/wovan/goproxy:v2.8.1
    # -metrics: Prometheus on a dedicated port (no /metrics on the module port).
    # -gcInterval: cache cleanup relies on atime; fine on ext4 (relatime), do
    # not enable on a noatime-mounted volume.
    command: "-listen=0.0.0.0:8081 -cacheDir=/ext -metrics=:9090 -gcInterval=24h -gcKeep=720h"
    ports:
    - "8081:8081"
    - "127.0.0.1:9090:9090"
    restart: always
    volumes:
      - ./cacheDir:/ext
